<style>
  *,
  *::before,
  *::after {
    font-family: Arial, sans-serif !important;
  }

  /* Project grid */
  #work {
    max-width: 1152px;
    margin: 0 auto;
    padding: 6rem 2rem 4rem;
  }

  #work .project-title {
    color: #000;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.2;
  }

  html.dark #work .project-title { color: #fff; }

  #project-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }

  #project-grid .project-card {
    display: flex;
    flex-direction: column;
    container-type: inline-size;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }

  #project-grid .folder-ratio {
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 4;
  }

  #project-grid .folder-backdrop {
    position: absolute;
    inset: auto 0 0;
    height: 90%;
    border-radius: 6.67cqw;
  }

  #project-grid .project-preview {
    position: absolute;
    top: 0;
    right: 6.67cqw;
    left: 6.67cqw;
    overflow: hidden;
    aspect-ratio: 5 / 4;
    transition: transform 300ms ease;
  }

  #project-grid .project-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #project-grid .project-card:hover .project-preview { transform: translateY(-5cqw); }

  #project-grid .archive-glass {
    position: absolute;
    z-index: 20;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 74%;
    transform-origin: bottom;
    transition: transform 300ms ease;
  }

  #project-grid .project-card:hover .archive-glass { transform: scaleY(.5); }

  #project-grid .archive-glass-layer {
    position: absolute;
    inset: 0;
    background: rgb(255 255 255 / 30%);
    -webkit-backdrop-filter: blur(5cqw);
    backdrop-filter: blur(5cqw);
  }

  #project-grid .folder-border {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #project-grid .archive-label {
    position: absolute;
    bottom: 6.67cqw;
    left: 6.67cqw;
    color: #fff;
    font-size: clamp(12px, 7.5cqw, 18px);
    line-height: 1.5;
  }

  #project-grid .project-caption {
    margin-top: 5cqw;
    text-align: center;
  }

  #project-grid .project-year {
    margin: 4px 0 0;
    color: #6b7280;
    font-size: clamp(12px, 5.83cqw, 14px);
    line-height: 1.5;
  }

  @media (max-width: 767px) {
    #work .project-title { font-size: 18px; }
  }

  @media (min-width: 640px) {
    #work { padding-top: 4rem; }
  }

  @media (min-width: 768px) {
    #project-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  /* Center the project grid vertically on larger screens. */
  @media (min-width: 1024px) {
    #work {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
      flex-direction: column;
      justify-content: center;
      padding-top: 80px;
      padding-bottom: 80px;
    }

    #work #project-grid { width: 100%; }
  }
</style>
<!-- Project cards are rendered from the data below. -->
<section id="work">
  <div id="project-grid"></div>
</section>

<script>
  // Keep variables local when reopening this tab.
  (() => {
    // Edit or add projects here.
    const projects = [
      {
        title: "Loan Market",
        image: "Projects/LM.webp",
        link: "https://www.behance.net/gallery/248730305/Loan-Market",
        color: "#91B8D4",
        year: "2025",
      },
      {
        title: "Vidio",
        image: "Projects/Vidio.webp",
        link: "https://www.behance.net/gallery/237299153/Vidio-Social-Media-Content",
        color: "#91B8D4",
        year: "2024",
      },
      {
        title: "Jagocpns",
        image: "Projects/Jagocpns.webp",
        link: "https://www.behance.net/gallery/237297073/Jagocpns",
        color: "#91B8D4",
        year: "2025",
      },
      {
        title: "Kirimaja",
        image: "Projects/Kirimaja.webp",
        link: "https://www.behance.net/gallery/237288371/Kirimaja-Branding",
        color: "#91B8D4",
        year: "2024",
      },
      {
        title: "Gikslab",
        image: "Projects/Gikslab.webp",
        link: "https://www.behance.net/gallery/182622713/Gikslab-Indonesia",
        color: "#91B8D4",
        year: "2023",
      },
      {
        title: "BEM Unpad",
        image: "Projects/KJ.webp",
        link: "https://www.behance.net/gallery/177106157/BEM-Unpad-2023-Kunci-Jawaban",
        color: "#91B8D4",
        year: "2023",
      },
      {
        title: "Prabu Unpad",
        image: "Projects/Prabu.webp",
        link: "https://www.behance.net/gallery/177036489/Prabu-Unpad-2022",
        color: "#91B8D4",
        year: "2022",
      },
      {
        title: "Smansaku Campus Expo",
        image: "Projects/SCE.webp",
        link: "https://www.behance.net/gallery/163697683/Smansaku-Campus-Expo-2022",
        color: "#91B8D4",
        year: "2022",
      },
    ];

    // Reuse the same folder layout for each project.
    function createProjectCard(project, index) {
      const folderPath = `
        M 20 0
        H 127
        Q 135 0 141 6
        L 162 27
        Q 169 34 179 34
        H 280
        A 20 20 0 0 1 300 54
        V 157.6
        A 20 20 0 0 1 280 177.6
        H 20
        A 20 20 0 0 1 0 157.6
        V 20
        A 20 20 0 0 1 20 0
        Z
      `;

      // Avoid confusing Live Server's HTML injection with this embedded SVG.
      const folderMask = `url(&quot;data:image/svg+xml,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 300 177.6"
             preserveAspectRatio="none">
          <path d="${folderPath}" fill="white"/>
        <\/svg>
      `)}&quot;)`;

      return `
        <a
          href="${project.link}"
          target="_blank"
          rel="noopener noreferrer"
          class="project-card"
        >
          <div class="folder-ratio">
            <!-- Folder color comes from the project data above. -->
            <div
              class="folder-backdrop"
              style="background-color: ${project.color};"
            ></div>

            <!-- Project preview -->
            <div
              class="project-preview"
            >
              <img
                src="${project.image}"
                alt="${project.title}"
                loading="eager"
              >
            </div>

            <div
              class="archive-glass"
            >
              <!-- Glass layer clipped to the folder shape -->
              <div
                class="archive-glass-layer"
                style="
                  -webkit-mask-image: ${folderMask};
                  mask-image: ${folderMask};
                  -webkit-mask-size: 100% 100%;
                  mask-size: 100% 100%;
                  -webkit-mask-repeat: no-repeat;
                  mask-repeat: no-repeat;
                "
              ></div>

              <!-- Gradient border around the folder -->
              <svg
                class="folder-border"
                viewBox="0 0 300 177.6"
                preserveAspectRatio="none"
                fill="none"
                aria-hidden="true"
                style="
                  -webkit-mask-image: ${folderMask};
                  mask-image: ${folderMask};
                  -webkit-mask-size: 100% 100%;
                  mask-size: 100% 100%;
                  -webkit-mask-repeat: no-repeat;
                  mask-repeat: no-repeat;
                "
              >
                <defs>
                  <linearGradient
                    id="border-${index}"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="177.6"
                    gradientUnits="userSpaceOnUse"
                  >
                    <stop offset="0%" stop-color="white" stop-opacity="0.3" />
                    <stop offset="50%" stop-color="white" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="white" stop-opacity="0" />
                  </linearGradient>
                </defs>

                <path
                  d="${folderPath}"
                  stroke="url(#border-${index})"
                  stroke-width="5"
                />
              <\/svg>

              <span
                class="archive-label"
              >
                Archive
              </span>
            </div>
          </div>

          <!-- Project title and year -->
          <div class="project-caption">
            <h3 class="project-title">
              ${project.title}
            </h3>
            <p class="project-year">
              ${project.year}
            </p>
          </div>
        </a>
      `;
    }

    // Render the project cards.
    const grid = document.getElementById("project-grid");
    grid.innerHTML = projects.map(createProjectCard).join("");

    // Randomize entrance timing without changing the displayed card order.
    function animateProjectCards() {
      if (!grid.isConnected || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const cards = Array.from(grid.children);
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      cards.forEach((card, order) => {
        // Stagger the upward entrance.
        const animation = card.animate([
          { opacity: 0, translate: "0 32px" },
          { opacity: 1, translate: "0 0" },
        ], {
          duration: 1000,
          delay: order * 35,
          easing: "cubic-bezier(0.22, 1, 0.36, 1)",
          fill: "both",
        });
        animation.finished.then(() => animation.cancel(), () => {});
      });
    }

    // Start the entrance after the page becomes visible.
    const pageContainer = grid.closest("#content");
    if (pageContainer) {
      pageContainer.addEventListener("pagereveal", animateProjectCards, { once: true });
      pageContainer.addEventListener("pageleave", () => {
        pageContainer.removeEventListener("pagereveal", animateProjectCards);
      }, { once: true });
    } else {
      requestAnimationFrame(animateProjectCards);
    }
  })();
</script>
