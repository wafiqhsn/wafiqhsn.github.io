    <style>
      body {
        font-family: Helvetica, Arial, sans-serif;
      }

      /* Legacy base styles; page utilities override some rules. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body.dark {
        background: #111;
        color: white;
      }

      nav {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 24px 48px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        backdrop-filter: blur(20px);
      }

      .nav-links {
        display: flex;
        gap: 24px;
      }

      .nav-links a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        max-width: 1000px;
        margin: auto;
        padding: 60px;
      }

      .fade-out {
        opacity: 0;
        transition: 0.15s;
      }

  <body class="bg-white dark:bg-black text-black dark:text-white transition-colors duration-300">
    <!-- Fixed navigation and theme toggle -->

    <div
      id="navbar"
      class="fixed top-3 left-1/2 -translate-x-1/2 z-[9999] transition-all duration-500 ease-[cubic-bezier(0.22,1,0.36,1)]"
    >
      <nav
        class="bg-[#FFE500] rounded-full p-1 flex items-center gap-[4px] relative transition-colors duration-300"
      >
        <div
          id="navPill"
          class="absolute left-0 top-0 bg-white rounded-full transition-[transform,width,height] duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] z-0 pointer-events-none"
        ></div>

        <a
          href="#"
          data-page="home.html"
          class="nav-link relative z-10 text-[13px] md:text-[16px] text-black font-medium px-2 md:px-2 py-[1px] md:py-0 rounded-full transition-colors duration-300"
          >Home</a
        >
        <a
          href="#"
          data-page="work.html"
          class="nav-link relative z-10 text-[13px] md:text-[16px] text-black font-medium px-2 md:px-2 py-[1px] md:py-0 rounded-full transition-colors duration-300"
          >Work</a
        >
        <a
          href="#"
          data-page="about.html"
          class="nav-link relative z-10 text-[13px] md:text-[16px] text-black font-medium px-2 md:px-2 py-[1px] md:py-0 rounded-full transition-colors duration-300"
          >About</a
        >

        <button
          id="themeToggle"
          aria-label="Toggle Dark Mode"
          class="relative w-6 h-5 flex items-center justify-center overflow-hidden text-black rounded-full ml-1"
        >
          <!-- SUN -->
          <svg
            class="absolute w-3 h-3 md:w-4 md:h-4 transition-transform duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)] translate-y-0 dark:translate-y-10"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>

          <!-- MOON -->
          <svg
            class="absolute w-3 h-3 md:w-4 md:h-4 transition-transform duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)] -translate-y-10 dark:translate-y-0"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

          </svg>

    </div>

    <!-- Active page content -->

    <main id="content" class="min-h-screen"></main>

    <script>
      const content = document.getElementById("content");

      const navLinks = document.querySelectorAll(".nav-link");

      const navPill = document.getElementById("navPill");

      // Track the active tab for resize updates.
      let activeLink = null;

      // Move the white indicator to the active tab.
      function movePill(link) {
        activeLink = link;

        navPill.style.width = `${link.offsetWidth}px`;

        navPill.style.height = `${link.offsetHeight}px`;

        navPill.style.transform = `translate(${link.offsetLeft}px,${link.offsetTop}px)`;

        navLinks.forEach((item) => {
          item.classList.remove("text-black");
          item.classList.add("text-black");
        });

        link.classList.remove("text-black");
        link.classList.add("text-black");
      }

      // Run scripts from the loaded page.
      function runScripts(container) {
        container.querySelectorAll("script").forEach((oldScript) => {
          const newScript = document.createElement("script");
          newScript.textContent = oldScript.textContent;
          document.body.appendChild(newScript);
          document.body.removeChild(newScript);
        });
      }

      const tabOrder = ["home.html", "work.html", "about.html"];
      const desktopScroll = window.matchMedia(
        "(min-width: 1024px) and (hover: hover) and (pointer: fine)",
      );
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let currentPage = null;
      let changingPage = false;
      let queuedPage = null;
      let destinationPage = null;
      let wheelTotal = 0;
      let lastWheelTime = 0;
      let wheelBlockedUntil = 0;

      // Avoid hiding a page indefinitely for slow or lazy-loaded images.
      function waitForImages(container) {
        return Promise.all(
          Array.from(container.querySelectorAll("img"))
            .filter((img) => !img.complete && img.loading !== "lazy" && img.getAttribute("src"))
            .map(
              (img) =>
                new Promise((resolve) => {
                  const finish = () => {
                    clearTimeout(timeout);
                    img.removeEventListener("load", finish);
                    img.removeEventListener("error", finish);
                    resolve();
                  };
                  const timeout = setTimeout(finish, 1500);
                  img.addEventListener("load", finish, { once: true });
                  img.addEventListener("error", finish, { once: true });
                  if (img.complete) finish();
                }),
            ),
        );
      }

      // Let dynamically generated styles and layout settle before revealing a page.
      function settlePageLayout() {
        return new Promise((resolve) => {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }

      // Move content up when advancing and down when returning.
      async function animatePage(entering, direction) {
        if (reducedMotion.matches) return;
        const distance = desktopScroll.matches ? 72 : 28;
        const hidden = {
          opacity: 0,
          transform: `translateY(${(entering ? direction : -direction) * distance}px)`,
        };
        const visible = { opacity: 1, transform: "translateY(0)" };
        const animation = content.animate(entering ? [hidden, visible] : [visible, hidden], {
          duration: entering ? 480 : 220,
          easing: "cubic-bezier(0.22, 1, 0.36, 1)",
          fill: "both",
        });
        try {
          await animation.finished;
        } finally {
          if (!entering) content.style.opacity = "0";
          animation.cancel();
        }
      }

      // Serialize navigation and keep the latest click while a page is loading.
      async function loadPage(page) {
        if (!tabOrder.includes(page)) return;
        if (changingPage) {
          queuedPage = page;
          return;
        }
        if (page === currentPage) return;
        changingPage = true;
        destinationPage = page;
        // Count the 800ms wheel delay from the start, not the end.
        wheelBlockedUntil = performance.now() + 800;
        content.setAttribute("aria-busy", "true");
        content.style.pointerEvents = "none";
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const direction =
          currentPage && tabOrder.indexOf(page) < tabOrder.indexOf(currentPage) ? -1 : 1;
        try {
          // Keep the existing page visible if fetching fails.
          const response = await fetch(page, { signal: controller.signal });
          if (!response.ok) throw new Error(`Unable to load ${page}: ${response.status}`);
          const html = await response.text();
          clearTimeout(timeout);
          if (currentPage) await animatePage(false, direction);
          content.style.opacity = "0";
          content.dispatchEvent(new Event("pageleave"));
          content.innerHTML = html;
          window.scrollTo({ top: 0, left: 0, behavior: "instant" });
          runScripts(content);
          currentPage = page;
          const link = Array.from(navLinks).find((item) => item.dataset.page === page);
          movePill(link);
          navLinks.forEach((item) => {
            if (item === link) item.setAttribute("aria-current", "page");
            else item.removeAttribute("aria-current");
          });
          await settlePageLayout();
          await waitForImages(content);
          await settlePageLayout();
          content.style.opacity = "1";
          content.dispatchEvent(new Event("pagereveal"));
          await animatePage(true, direction);
        } catch (error) {
          console.error("Page navigation failed:", error);
        } finally {
          clearTimeout(timeout);
          content.style.opacity = "1";
          content.removeAttribute("aria-busy");
          content.style.removeProperty("pointer-events");
          changingPage = false;
          wheelTotal = 0;
          destinationPage = null;
          const nextPage = queuedPage;
          queuedPage = null;
          if (nextPage && nextPage !== currentPage) loadPage(nextPage);
        }
      }

      navLinks.forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          loadPage(link.dataset.page);
        });
      });
      window.addEventListener("load", () => loadPage("home.html"));
      window.navigateTo = loadPage;

      // Preserve scrolling inside nested panels and form controls.
      function canScrollInside(target, direction) {
        if (!(target instanceof Element)) return false;
        if (target.closest("input, textarea, select, [contenteditable]")) return true;
        for (let node = target; node && node !== document.body; node = node.parentElement) {
          if (!/(auto|scroll)/.test(getComputedStyle(node).overflowY)) continue;
          if (direction > 0 && node.scrollTop + node.clientHeight < node.scrollHeight - 2)
            return true;
          if (direction < 0 && node.scrollTop > 2) return true;
        }
        return false;
      }

      // Continuous desktop wheel navigation, with an 800ms cooldown at page edges.
      document.addEventListener(
        "wheel",
        (event) => {
          if (
            !desktopScroll.matches ||
            event.ctrlKey ||
            event.metaKey ||
            !event.deltaY ||
            Math.abs(event.deltaX) > Math.abs(event.deltaY)
          )
            return;
          const direction = Math.sign(event.deltaY);
          if (canScrollInside(event.target, direction)) return;
          const now = performance.now();
          const newGesture = now - lastWheelTime > 220;
          lastWheelTime = now;
          if (newGesture) {
            wheelTotal = 0;
          }
          const scroller = document.scrollingElement;
          const atEdge =
            direction > 0
              ? scroller.scrollTop + window.innerHeight >= scroller.scrollHeight - 3
              : scroller.scrollTop <= 3;
          if (!atEdge && !changingPage) {
            wheelTotal = 0;
            return;
          }
          const nextIndex = tabOrder.indexOf(destinationPage || currentPage) + direction;
          if (!currentPage || nextIndex < 0 || nextIndex >= tabOrder.length) return;
          event.preventDefault();
          if (now < wheelBlockedUntil) return;
          const delta =
            event.deltaY *
            (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1);
          if (Math.sign(wheelTotal) !== direction) wheelTotal = 0;
          wheelTotal += delta;
          if (Math.abs(wheelTotal) < 60) return;
          wheelTotal = 0;
          wheelBlockedUntil = now + 800;
          loadPage(tabOrder[nextIndex]);
        },
        { passive: false },
      );

      // Update the active pill after resizing.
      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);

        resizeTimeout = setTimeout(() => {
          if (activeLink) {
            movePill(activeLink);
          }
        }, 50);
      });

      const themeToggle = document.getElementById("themeToggle");

      // Toggle the dark theme.
      themeToggle.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
      });

      // Vertical touch navigation: swipe up for next, down for previous.
      // Start at a page edge so long pages keep their normal reading scroll.
      let touchGesture = null;
      document.addEventListener("touchstart", (event) => {
        touchGesture = null;
        if (event.touches.length !== 1 || !currentPage) return;
        const touch = event.touches[0];
        const scroller = document.scrollingElement;
        touchGesture = {
          x: touch.clientX,
          y: touch.clientY,
          target: event.target,
          atTop: scroller.scrollTop <= 3,
          atBottom: scroller.scrollTop + window.innerHeight >= scroller.scrollHeight - 3,
          direction: 0,
          distance: 0,
        };
      }, { passive: true });

      document.addEventListener("touchmove", (event) => {
        if (!touchGesture) return;
        if (event.touches.length !== 1) { touchGesture = null; return; }
        const dx = event.touches[0].clientX - touchGesture.x;
        const dy = touchGesture.y - event.touches[0].clientY;
        touchGesture.direction = 0;
        touchGesture.distance = 0;
        if (Math.abs(dy) <= Math.abs(dx) || Math.abs(dy) < 10) return;
        const direction = Math.sign(dy);
        if (canScrollInside(touchGesture.target, direction)) return;
        if (direction > 0 ? !touchGesture.atBottom : !touchGesture.atTop) return;
        const index = tabOrder.indexOf(destinationPage || currentPage) + direction;
        if (index < 0 || index >= tabOrder.length) return;
        // Prevent overscroll only when this gesture can navigate to another page.
        if (event.cancelable) event.preventDefault();
        touchGesture.direction = direction;
        touchGesture.distance = Math.abs(dy);
      }, { passive: false });

      document.addEventListener("touchend", () => {
        const gesture = touchGesture;
        touchGesture = null;
        if (!gesture || !gesture.direction || gesture.distance < 60) return;
        const now = performance.now();
        if (now < wheelBlockedUntil) return;
        const index = tabOrder.indexOf(destinationPage || currentPage) + gesture.direction;
        if (index < 0 || index >= tabOrder.length) return;
        wheelBlockedUntil = now + 800;
        loadPage(tabOrder[index]);
      }, { passive: true });

      // Leave pinch zoom and cancelled gestures to the browser.
      document.addEventListener("touchcancel", () => { touchGesture = null; }, { passive: true });
    </script>
  </body>
</html>
