    <style>
      /* Shared page styles */
      html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        background: #fff;
        color: #000;
        transition: background-color 300ms ease, color 300ms ease;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif !important;
      }

      html.dark body {
        background: #000;
        color: #fff;
      }

      #content {
        min-height: 100vh;
        touch-action: pan-y pinch-zoom;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      button { font: inherit; }

      img,
      svg,
      video,
      canvas,
      audio,
      iframe,
      embed,
      object {
        display: block;
        vertical-align: middle;
      }

      img,
      video {
        max-width: 100%;
        height: auto;
      }

      /* Main navigation */
      #navbar {
        position: fixed;
        top: 17px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
      }

      #navbar nav {
        --nav-padding: 3px;
        --active-tab: 0;
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr)) 32px;
        width: 250px;
        height: 30px;
        padding: var(--nav-padding);
        border: 1px solid #e1e4e8;
        border-radius: 999px;
        background: #e5e7eb;
      }

      #navbar nav::before {
        content: "";
        position: absolute;
        top: var(--nav-padding);
        bottom: var(--nav-padding);
        left: var(--nav-padding);
        width: calc((100% - 2 * var(--nav-padding) - 32px) / 4);
        border-radius: 999px;
        border: 1px solid #e5e7eb;
        background: #fff;
        transform: translateX(calc(var(--active-tab) * 100%));
        transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
        z-index: 0;
      }

      #navbar .nav-link {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 400;
        line-height: 1;
        text-decoration: none;
        color: #000;
        background: transparent;
        -webkit-tap-highlight-color: transparent;
      }

      #navbar #themeToggle {
        width: 32px;
        margin: 0;
      }

      #navbar .theme-toggle {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #000;
        cursor: pointer;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      #navbar .theme-toggle svg {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 16px;
        transform: translate(-50%, -50%);
        transition: transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      #navbar .theme-toggle .theme-icon-moon {
        transform: translate(-50%, calc(-50% - 30px));
      }

      html.dark #navbar .theme-icon-sun {
        transform: translate(-50%, calc(-50% + 30px));
      }

      html.dark #navbar .theme-icon-moon { transform: translate(-50%, -50%); }

      #navbar .nav-link:focus-visible {
        outline: 1px solid #333;
        outline-offset: 1px;
      }
      #navbar .theme-toggle:focus-visible {
        outline: 1px solid #333;
        outline-offset: 1px;
      }

      html.dark #navbar nav {
        border-color: #404040;
        background: #262626;
      }

      html.dark #navbar nav::before {
        border-color: #262626;
      }

      html.dark #navbar .nav-link,
      html.dark #navbar .theme-toggle {
        color: #fff;
      }

      html.dark #navbar .nav-link[aria-current="page"] {
        color: #000;
      }

      @media (max-width: 767px) {
        #navbar { top: 16px; }
        #navbar nav {
          --nav-padding: 2px;
          width: 218px;
          height: 28px;
        }
        #navbar .nav-link {
          font-size: 12px;
          line-height: 1.2;
        }

        #navbar .theme-toggle { line-height: 1; }

        #navbar nav {
          grid-template-columns: repeat(4, minmax(0, 1fr)) 28px;
        }

        #navbar nav::before {
          width: calc((100% - 2 * var(--nav-padding) - 28px) / 4);
        }

        #navbar #themeToggle { width: 28px; }

        #navbar .theme-toggle svg {
          width: 14px;
          height: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #navbar nav::before { transition: none; }
        #navbar .theme-toggle svg { transition: none; }
      }
    </style>
  </head>

  <body>
    <!-- Main navigation -->
    <div id="navbar">
      <nav aria-label="Main navigation">
        <a href="#" class="nav-link" data-page="home.html" aria-current="page">Home</a>
        <a href="#" class="nav-link" data-page="work.html">Work</a>
        <a href="#" class="nav-link" data-page="labs.html">Labs</a>
        <a href="#" class="nav-link" data-page="about.html">About</a>
        <button
          id="themeToggle"
          aria-label="Toggle Dark Mode"
          class="theme-toggle"
        >
          <!-- Sun icon -->
          <svg
            class="theme-icon theme-icon-sun"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>

          <!-- Moon icon -->
          <svg
            class="theme-icon theme-icon-moon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </nav>
    </div>

    <main id="content"></main>
    <script>
      const content = document.getElementById("content");
      const navLinks = document.querySelectorAll(".nav-link");
      const themeToggle = document.getElementById("themeToggle");
      const nav = document.querySelector("#navbar nav");

      themeToggle.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("dark");
        themeToggle.setAttribute("aria-pressed", String(isDark));
        themeToggle.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode",
        );
      });

      // Re-create injected scripts so each page can initialize its own behavior.
      function runScripts(container) {
        container.querySelectorAll("script").forEach((oldScript) => {
          const newScript = document.createElement("script");
          newScript.textContent = oldScript.textContent;
          document.body.appendChild(newScript);
          document.body.removeChild(newScript);
        });
      }

      // This order controls navigation by trackpad and touch.
      const tabOrder = ["home.html", "work.html", "labs.html", "about.html"];
      const desktopScroll = window.matchMedia(
        "(min-width: 1024px) and (hover: hover) and (pointer: fine)",
      );
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let currentPage = null;
      let changingPage = false;
      let queuedPage = null;
      let destinationPage = null;
      let wheelTotal = 0;
      let lastWheelTime = 0;
      let wheelBlockedUntil = 0;

      // Avoid hiding a page indefinitely for slow or lazy-loaded images.
      function waitForImages(container) {
        return Promise.all(
          Array.from(container.querySelectorAll("img"))
            .filter((img) => !img.complete && img.loading !== "lazy" && img.getAttribute("src"))
            .map(
              (img) =>
                new Promise((resolve) => {
                  const finish = () => {
                    clearTimeout(timeout);
                    img.removeEventListener("load", finish);
                    img.removeEventListener("error", finish);
                    resolve();
                  };
                  const timeout = setTimeout(finish, 1500);
                  img.addEventListener("load", finish, { once: true });
                  img.addEventListener("error", finish, { once: true });
                  if (img.complete) finish();
                }),
            ),
        );
      }

      // Let dynamically generated styles and layout settle before revealing a page.
      function settlePageLayout() {
        return new Promise((resolve) => {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }

      // Every page moves upward on entry and exit, regardless of navigation direction.
      async function animatePage(entering) {
        if (reducedMotion.matches) return;
        const distance = desktopScroll.matches ? 72 : 28;
        const hidden = {
          opacity: 0,
          transform: `translateY(${(entering ? 1 : -1) * distance}px)`,
        };
        const visible = { opacity: 1, transform: "translateY(0)" };
        const animation = content.animate(entering ? [hidden, visible] : [visible, hidden], {
          duration: entering ? 480 : 220,
          easing: "cubic-bezier(0.22, 1, 0.36, 1)",
          fill: "both",
        });
        try {
          await animation.finished;
        } finally {
          if (!entering) content.style.opacity = "0";
          animation.cancel();
        }
      }

      // Move the active pill immediately, even if the page is still loading.
      function updateActiveTab(page) {
        const activeIndex = Math.max(0, tabOrder.indexOf(page));
        nav.style.setProperty("--active-tab", activeIndex);

        navLinks.forEach((link) => {
          if (link.dataset.page === page) link.setAttribute("aria-current", "page");
          else link.removeAttribute("aria-current");
        });
      }

      // Serialize navigation and keep the latest click while a page is loading.
      async function loadPage(page) {
        if (!tabOrder.includes(page)) return;
        updateActiveTab(page);
        if (changingPage) {
          queuedPage = page;
          return;
        }
        if (page === currentPage) return;
        const isInitialLoad = currentPage === null;
        changingPage = true;
        destinationPage = page;
        // Count the horizontal gesture cooldown from the start of navigation.
        wheelBlockedUntil = performance.now() + 800;
        content.setAttribute("aria-busy", "true");
        content.style.pointerEvents = "none";
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        try {
          // Keep the existing page visible if fetching fails.
          const response = await fetch(page, { signal: controller.signal, cache: "no-cache" });
          if (!response.ok) throw new Error(`Unable to load ${page}: ${response.status}`);
          const html = await response.text();
          clearTimeout(timeout);
          if (currentPage) await animatePage(false);
          content.style.opacity = "0";
          content.dispatchEvent(new Event("pageleave"));
          content.innerHTML = html;
          window.scrollTo({ top: 0, left: 0, behavior: "instant" });
          runScripts(content);
          currentPage = page;
          if (!isInitialLoad) {
            await settlePageLayout();
            await waitForImages(content);
            await settlePageLayout();
          }
          content.style.opacity = "1";
          content.dispatchEvent(new Event("pagereveal"));
          if (!isInitialLoad) await animatePage(true);
        } catch (error) {
          console.error("Page navigation failed:", error);
        } finally {
          clearTimeout(timeout);
          content.style.opacity = "1";
          content.removeAttribute("aria-busy");
          content.style.removeProperty("pointer-events");
          changingPage = false;
          wheelTotal = 0;
          destinationPage = null;
          const nextPage = queuedPage;
          queuedPage = null;
          if (nextPage && nextPage !== currentPage) loadPage(nextPage);
          // Restore the visible page if loading fails; never overwrite a queued click.
          else updateActiveTab(currentPage || "home.html");
        }
      }

      // Navigate between pages without reloading the site.
      navLinks.forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          loadPage(link.dataset.page);
        });
      });
      // Load Home as soon as the page scripts are ready.
      queueMicrotask(() => loadPage("home.html"));
      window.navigateTo = loadPage;

      // Leave form controls and horizontally scrollable panels interactive.
      function canScrollInside(target, direction) {
        if (!(target instanceof Element)) return false;
        if (target.closest("input, textarea, select, [contenteditable]")) return true;
        for (let node = target; node && node !== document.body; node = node.parentElement) {
          if (!/(auto|scroll)/.test(getComputedStyle(node).overflowX)) continue;
          if (direction > 0 && node.scrollLeft + node.clientWidth < node.scrollWidth - 2) return true;
          if (direction < 0 && node.scrollLeft > 2) return true;
        }
        return false;
      }

      // Horizontal trackpad navigation; vertical wheel scrolling stays within the page.
      document.addEventListener(
        "wheel",
        (event) => {
          const horizontal = event.deltaX || (event.shiftKey ? event.deltaY : 0);
          if (!desktopScroll.matches || event.ctrlKey || event.metaKey || !horizontal) return;
          if (!event.shiftKey && Math.abs(horizontal) <= Math.abs(event.deltaY)) return;

          const direction = Math.sign(horizontal);
          if (canScrollInside(event.target, direction)) return;

          const now = performance.now();
          if (now - lastWheelTime > 220) wheelTotal = 0;
          lastWheelTime = now;

          const nextIndex = tabOrder.indexOf(destinationPage || currentPage) + direction;
          if (!currentPage || nextIndex < 0 || nextIndex >= tabOrder.length) return;
          event.preventDefault();
          if (now < wheelBlockedUntil) return;

          const multiplier = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerWidth : 1;
          const delta = horizontal * multiplier;
          if (Math.sign(wheelTotal) !== direction) wheelTotal = 0;
          wheelTotal += delta;
          if (Math.abs(wheelTotal) < 60) return;

          wheelTotal = 0;
          wheelBlockedUntil = now + 800;
          loadPage(tabOrder[nextIndex]);
        },
        { passive: false },
      );

      // Touch navigation: swipe left for the next page, right for the previous page.
      let touchGesture = null;
      document.addEventListener(
        "touchstart",
        (event) => {
          touchGesture = null;
          if (event.touches.length !== 1 || !currentPage) return;

          const touch = event.touches[0];
          touchGesture = {
            x: touch.clientX,
            y: touch.clientY,
            target: event.target,
            direction: 0,
            distance: 0,
          };
        },
        { passive: true },
      );

      document.addEventListener(
        "touchmove",
        (event) => {
          if (!touchGesture) return;
          if (event.touches.length !== 1) {
            touchGesture = null;
            return;
          }

          const dx = touchGesture.x - event.touches[0].clientX;
          const dy = event.touches[0].clientY - touchGesture.y;
          touchGesture.direction = 0;
          touchGesture.distance = 0;
          if (Math.abs(dx) <= Math.abs(dy) || Math.abs(dx) < 10) return;

          const direction = Math.sign(dx);
          if (canScrollInside(touchGesture.target, direction)) return;

          const index = tabOrder.indexOf(destinationPage || currentPage) + direction;
          if (index < 0 || index >= tabOrder.length) return;
          if (event.cancelable) event.preventDefault();
          touchGesture.direction = direction;
          touchGesture.distance = Math.abs(dx);
        },
        { passive: false },
      );

      document.addEventListener(
        "touchend",
        () => {
          const gesture = touchGesture;
          touchGesture = null;
          if (!gesture || !gesture.direction || gesture.distance < 60) return;

          const now = performance.now();
          if (now < wheelBlockedUntil) return;

          const index = tabOrder.indexOf(destinationPage || currentPage) + gesture.direction;
          if (index < 0 || index >= tabOrder.length) return;
          wheelBlockedUntil = now + 800;
          loadPage(tabOrder[index]);
        },
        { passive: true },
      );

      // Leave pinch zoom and cancelled gestures to the browser.
      document.addEventListener(
        "touchcancel",
        () => {
          touchGesture = null;
        },
        { passive: true },
      );
    </script>
  </body>
</html>
